nelmio_api_doc :
    documentation :
        info :
            title: Restaurant API
            description : Documentation de l'API Restaurant Studi.
            version : 1.0.0
        components :
            securitySchemes :
                X-AUTH-TOKEN:
                    type : apiKey
                    name: X-AUTH-TOKEN
                    in: header
                cookieAuth:
                    type: apiKey
                    name: __Host-quai_session
                    in: cookie
            schemas:
                ApiError:
                    type: object
                    required: [message]
                    properties:
                        message: { type: string }
                ServiceUnavailable:
                    type: object
                    required: [message, code]
                    properties:
                        message: { type: string, example: 'Service temporairement indisponible.' }
                        code: { type: string, example: AUTH_RATE_LIMIT_UNAVAILABLE }
                MessageResponse:
                    type: object
                    required: [message]
                    properties:
                        message: { type: string }
                AccountUser:
                    type: object
                    properties:
                        id: { type: integer, nullable: true }
                        email: { type: string }
                        firstName: { type: string }
                        lastName: { type: string }
                        guestNumber: { type: integer, nullable: true }
                        allergy: { type: string, nullable: true }
                        roles: { type: array, items: { type: string } }
                Category:
                    type: object
                    properties:
                        id: { type: integer, nullable: true }
                        title: { type: string }
                        createdAt: { type: string, format: date-time, nullable: true }
                        updatedAt: { type: string, format: date-time, nullable: true }
                Food:
                    type: object
                    properties:
                        id: { type: integer, nullable: true }
                        title: { type: string }
                        description: { type: string }
                        price: { type: integer }
                        categories:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: integer }
                                    title: { type: string }
                        createdAt: { type: string, format: date-time, nullable: true }
                        updatedAt: { type: string, format: date-time, nullable: true }
                Menu:
                    type: object
                    properties:
                        id: { type: integer, nullable: true }
                        title: { type: string }
                        description: { type: string }
                        price: { type: integer }
                        restaurant:
                            type: object
                            properties:
                                id: { type: integer, nullable: true }
                                name: { type: string, nullable: true }
                        categories:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: integer }
                                    title: { type: string }
                        createdAt: { type: string, format: date-time, nullable: true }
                        updatedAt: { type: string, format: date-time, nullable: true }
                Booking:
                    type: object
                    properties:
                        id: { type: integer, nullable: true }
                        date: { type: string, format: date }
                        hour: { type: string, example: '19:30' }
                        guestNumber: { type: integer }
                        allergy: { type: string, nullable: true }
                        restaurantId: { type: integer }
                        client:
                            type: object
                            properties:
                                id: { type: integer, nullable: true }
                                email: { type: string }
                                firstName: { type: string }
                                lastName: { type: string }
                Picture:
                    type: object
                    properties:
                        id: { type: integer, nullable: true }
                        title: { type: string }
                        slug: { type: string }
                        imageUrl: { type: string, description: 'Chemin public ou URL data pour les images ajoutées.' }
                        createdAt: { type: string, format: date-time }
        security:
            - X-AUTH-TOKEN: [ ]
            - cookieAuth: [ ]
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
