security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            stateless: true

            json_login:
                check_path: app_api_login

            custom_authenticator: App\Security\ApiTokenAuthenticator

    access_control:
        # Routes publiques
        - { path: ^/api/registration$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }

        # Administration du restaurant : administrateur uniquement.
        - { path: ^/api/restaurant, roles: ROLE_ADMIN, methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api/restaurant, roles: ROLE_USER, methods: [GET] }

        # Toutes les autres routes API nécessitent une authentification.
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10