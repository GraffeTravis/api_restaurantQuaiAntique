
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build: &api-build
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment: &api-environment
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.docker}
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}?serverVersion=18&charset=utf8"
      CORS_ALLOW_ORIGIN: '${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$}'
      LOCK_DSN: ${LOCK_DSN:-flock}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8000}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-0}
      MONGODB_URI: "mongodb://${MONGO_USER:?Set MONGO_USER in .env.docker}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env.docker}@mongodb:27017/?authSource=admin"
      MONGODB_DATABASE: ${MONGODB_DATABASE:-quai_antique_analytics}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8080); exit($$s ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - restaurant_uploads:/var/www/html/public/uploads/restaurants

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Set MONGO_USER in .env.docker}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env.docker}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  analytics-worker:
    build: *api-build
    environment:
      <<: *api-environment
      MIGRATE_ON_START: "0"
    command: ["php", "bin/console", "messenger:consume", "analytics", "--time-limit=3600", "--memory-limit=128M", "--no-interaction"]
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  restaurant_uploads:
  mongodb_data:
